dataset:
  image_dir: data/KITTI-360/2013_05_28_drive_0000_sync/image_00/data_rgb
  stamp_path: data/KITTI-360/2013_05_28_drive_0000_sync/camstamp.txt
  calib: config/intrinsics_kitti360.yaml
  start: 0
  end: -1
  subsample: 1

imu:
  use_imu: true
  path: data/KITTI-360/2013_05_28_drive_0000_sync/imu.txt
  dt: -0.04
  gyro_unit: deg

frontend:
  type: vins
  max_features: 400
  min_distance: 20
  keyframe_gap: 5
  keyframe_parallax: 20.0
  fb_thresh: 0.5
  reject_with_f: true
  f_ransac_thresh: 1.5

backend:
  window_size: 8
  min_triangulation_parallax: 8.0
  min_track_observations: 3
  max_ba_iters: 5
  max_ba_points: 160
  robust_reprojection: false
  vi_init_min_keyframes: 8
  vi_init_min_points: 50
  vi_init_min_baseline: 0.05
  vi_init_disable_scale: true
  vi_init_min_scale: 0.05
  vi_init_max_scale: 20.0
  vi_init_max_gyro_bias: 0.2
  accel_noise_sigma: 0.00001962
  gyro_noise_sigma: 0.00001028445124575
  accel_bias_rw_sigma: 0.00004905
  gyro_bias_rw_sigma: 0.00000036361026075
  marginal_pose_sigma: 0.03
  marginal_velocity_sigma: 0.3
  marginal_bias_sigma: 0.001
  marginal_point_sigma: 0.2
  final_global_ba: false
  max_global_ba_points: 1600
  max_global_ba_iters: 8
  min_pnp_inliers: 30
  min_pnp_inlier_ratio: 0.2
  max_pnp_reproj_rmse: 3.5
  max_init_rotation_deg: 12.0
  max_init_translation_factor: 4.0
  max_init_translation_abs: 8.0
  vo_init_translation: 0.25
  vo_max_translation: 0.6
  vo_pose_prior_rot_sigma: 0.03
  vo_pose_prior_trans_sigma: 0.05
  odom_prior_rot_sigma: 0.05
  odom_prior_trans_sigma: 0.03
  vio_imu_mode: predict_align
  gyro_factor_rot_sigma: 0.01
  gyro_factor_trans_sigma: 1000000.0
  vio_visual_pose_prior_rot_sigma: 0.02
  vio_visual_pose_prior_trans_sigma: 0.05
  vio_max_pose_update_trans: 0.25
  vio_max_pose_update_rot_deg: 5.0
  vio_use_imu_rotation: false
  fix_vo_poses: true
  fixed_pose_sigma: 0.000001
  max_landmark_depth: 80.0
  max_landmark_reproj_error: 4.0

viz:
  out_dir: sparse_vio_demo/output/kitti360
  result_tum: sparse_vio_demo/output/kitti360/estimate.tum
  trajectory_frame: body
  write_video: true
  foxglove:
    enabled: false
    host: 127.0.0.1
    port: 8765
    jpeg_quality: 85
    publish_every: 1
    max_points: 3000
