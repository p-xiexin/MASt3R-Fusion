inherit: config/base_kitti360_pi3x.yaml

pi3x:
  imu_predict: true
  delayed_matching: true
  viz_matching: true
  delayed_batch_keyframes: 5
  sparse_map:
    enabled: true
    max_keyframe_gap: 20
    keyframe_ref_ratio: 0.9
    min_tracked_points_for_keyframe: 15
    initializer_min_frame_gap: 2
    initializer_min_features: 100
    initializer_min_inliers: 5
    min_tracking_inliers: 20
    local_keyframes: 80
    map_points_per_keyframe: 2000
    reprojection_error: 3.0
