inherit: config/base_kitti360_pi3x.yaml

pi3x:
  imu_predict: true
  delayed_matching: true
  viz_matching: true
  delayed_batch_keyframes: 5
  sparse_map:
    enabled: true
    keyframe_gap: 5
    keyframe_parallax: 20.0
    min_keyframe_gap: 2
    max_keyframe_gap: 20
    keyframe_ref_ratio: 0.9
    min_tracked_points_for_keyframe: 15
    force_keyframe_gyro_deg: 30.0
    suppress_keyframe_gyro_deg: 5.0
    suppress_keyframe_translation: 1.0
    suppress_keyframe_parallax: 3.0
    initializer_min_frame_gap: 2
    initializer_min_features: 100
    initializer_min_inliers: 5
    min_tracking_inliers: 20
    local_keyframes: 80
    map_points_per_keyframe: 2000
    visualization_downsample: 5
    reprojection_error: 3.0
