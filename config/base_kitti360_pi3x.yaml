inherit: config/base_kitti360.yaml

dataset:
  # Pi3X uses patch size 14. Crop/resize images to a fixed H,W target and
  # update Intrinsics.K_frame with the same transform.
  target_img_size: [378, 504]

frontend_model:
  name: pi3x
  weights: checkpoints/pi3x/model.safetensors

pi3x:
  match_conf_threshold: 0.3
  # Optional Pi3X multimodal conditioning. Keep these as experiment switches:
  # intrinsics is usually the safest prior. imu_predict enables IMU-predicted
  # pose prior and should be tested both with rotation only and full translation.
  use_intrinsics_prior: false
  imu_predict: false
  pose_prior_max_dt: 5.0

matching:
  # Pi3X does not expose MASt3R descriptors; RGB fallback descriptors are weak.
  # Start without descriptor-neighborhood refinement for first server tests.
  radius: 0

tracking:
  # Pi3X confidence is sigmoid-normalized to [0, 1], unlike MASt3R desc_conf.
  Q_conf: 0.3
  min_match_frac: 0.01

local_opt:
  Q_conf: 0.3

ms_opt:
  subpixel_factor: 1
